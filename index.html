<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MOTOBY - Premium Used Motorcycles</title>
    <link rel="icon" type="image/png" href="logo.png">
    <!-- Set the theme before stylesheets load to avoid a flash of the wrong theme -->
    <script src="theme.js"></script>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="filters.css">
    <link rel="stylesheet" href="catalog.css">
    <link rel="stylesheet" href="product.css">
    <link rel="stylesheet" href="gallery.css">
    <link rel="stylesheet" href="favorites.css">
    <link rel="stylesheet" href="responsive.css">
</head>
<body>

    <header class="glass-panel">
        <div class="header-container">

            <div class="contacts">
                <a href="#" class="contact-link" id="contactTelegram" target="_blank" rel="noopener noreferrer">
                    <svg viewBox="2 2 20 20" width="16" height="16" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.11.02-1.93 1.23-5.46 3.62-.51.35-.98.53-1.39.51-.46-.01-1.33-.26-1.98-.47-.8-.26-1.42-.4-1.37-.85.03-.24.36-.48 1-.73 3.89-1.69 6.5-2.8 7.83-3.34 3.72-1.53 4.49-1.8 5 .04.11.11.14.23.15.35z"/>
                    </svg>
                    <span>Telegram</span>
                </a>
                <a href="#" class="contact-link" id="contactWhatsapp" target="_blank" rel="noopener noreferrer">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/>
                    </svg>
                    <span>WhatsApp</span>
                </a>
                <a href="#" class="contact-link" id="contactEmail">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                        <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                    </svg>
                    <span id="contactEmailText">Email</span>
                </a>
            </div>

            <div class="header-brand">
                <a href="index.html" class="logo-link">
                    <img src="logo.png" alt="MOTOBY" class="logo-img" data-theme-logo>
                </a>
            </div>

            <div class="header-controls">
                <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch theme" title="Switch theme">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm0 16a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1zM3 11h2a1 1 0 1 1 0 2H3a1 1 0 1 1 0-2zm16 0h2a1 1 0 1 1 0 2h-2a1 1 0 1 1 0-2zM5.64 5.64a1 1 0 0 1 1.42 0l1.41 1.41a1 1 0 0 1-1.41 1.42L5.64 7.05a1 1 0 0 1 0-1.41zm9.89 9.89a1 1 0 0 1 1.42 0l1.41 1.41a1 1 0 0 1-1.41 1.42l-1.42-1.42a1 1 0 0 1 0-1.41zM18.36 5.64a1 1 0 0 1 0 1.41l-1.41 1.42a1 1 0 0 1-1.42-1.42l1.42-1.41a1 1 0 0 1 1.41 0zM8.47 15.53a1 1 0 0 1 0 1.41l-1.41 1.42a1 1 0 0 1-1.42-1.42l1.42-1.41a1 1 0 0 1 1.41 0z"/>
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M21.75 14.4a1 1 0 0 0-1.05-.27 7.5 7.5 0 0 1-9.83-9.83 1 1 0 0 0-1.32-1.32 9.5 9.5 0 1 0 12.47 12.47 1 1 0 0 0-.27-1.05z"/>
                    </svg>
                </button>
                <div class="lang-switcher">
                    <button class="lang-btn" data-lang="RU">RU</button>
                    <button class="lang-btn" data-lang="EN">EN</button>
                    <button class="lang-btn" data-lang="PL">PL</button>
                </div>
            </div>

        </div>
    </header>

    <main>

        <section class="search-filter-section glass-panel">
            <div class="search-wrapper">
                <svg class="search-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Search...">
            </div>

            <div class="filters-grid">
                <div class="brand-dropdown-wrapper" id="brandDropdownWrapper">
                    <!-- built by buildBrandFilter() -->
                </div>
                <input type="number" id="filterYearFrom"   class="filter-input" placeholder="Year From">
                <input type="number" id="filterEngineFrom" class="filter-input" placeholder="Engine From">
                <input type="number" id="filterEngineTo"   class="filter-input" placeholder="Engine To">
                <button id="btnResetFilters" class="btn-reset">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 4v6h-6M1 20v-6h6"></path>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                    <span data-i18n="reset_filters">Reset Filters</span>
                </button>
                <div class="filter-favorites-cell">
                    <label class="switch">
                        <input type="checkbox" id="toggleShowFavorites">
                        <span class="slider"></span>
                    </label>
                    <span class="toggle-label" data-i18n="show_favorites">Favorites</span>
                </div>
                <div class="toggle-wrapper">
                    <label class="switch">
                        <input type="checkbox" id="toggleShowSold">
                        <span class="slider"></span>
                    </label>
                    <span class="toggle-label" data-i18n="show_sold">Show Sold</span>
                    <div id="resultsCounter" class="results-counter"></div>
                </div>
            </div>
        </section>

        <section class="catalog-grid" id="catalogGrid">
            <div class="card"><div class="card-media"><div class="skeleton"></div></div></div>
            <div class="card"><div class="card-media"><div class="skeleton"></div></div></div>
            <div class="card"><div class="card-media"><div class="skeleton"></div></div></div>
            <div class="card"><div class="card-media"><div class="skeleton"></div></div></div>
        </section>

        <div class="load-more-container">
            <button id="btnLoadMore" class="btn-load-more" data-i18n="load_more" style="display:none">Load More</button>
        </div>

    </main>

    <script src="config.js"></script>
    <script src="favorites.js"></script>
    <script src="translations.js"></script>
    <script src="language.js"></script>
    <script src="storage.js"></script>
    <script src="filters.js"></script>
    <script src="catalog.js"></script>
    <script src="app.js"></script>
</body>
</html>
